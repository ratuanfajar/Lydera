name: Build and Deploy

# ============================================================
# TRIGGER
#
# 1. Push tag  -> BUILD + PUSH + DEPLOY
#
# 2. Manual    -> BUILD + PUSH
#                 DEPLOY hanya jika dipilih
# ============================================================
on:
  push:
    tags:
      - "lydera-*"
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag untuk build baru (kosongkan kalau mau rollback)"
        required: false
        default: "test"

      deploy:
        description: "Deploy ke VPS setelah build?"
        required: true
        type: boolean
        default: false

      rollback_tag:
        description: "ISI INI KALAU MAU ROLLBACK (contoh: 1.0.0). Kosongkan untuk build normal."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lydera

jobs:
  # ============================================================
  # JOB 1: BUILD IMAGE + PUSH KE GHCR
  # ============================================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Tentukan image tag
      #
      # Manual:
      #   inputs.image_tag
      #
      # Push tag:
      #   lydera-1.0.0 -> 1.0.0
      # --------------------------------------------------------
      - name: Ekstrak versi
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.image_tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#lydera-}"
            VERSION="${VERSION#v}"
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version terdeteksi: $VERSION"

      # --------------------------------------------------------
      # Login ke GHCR
      # --------------------------------------------------------
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build + Push Docker Image
      # --------------------------------------------------------
      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 2: DEPLOY KE VPS
  #
  # Push tag:
  #   -> otomatis deploy
  #
  # Manual:
  #   -> deploy hanya kalau inputs.deploy = true
  # ============================================================
  deploy:
    needs: build

    if: |
      github.event_name == 'push' ||
      inputs.deploy == true

    runs-on: ubuntu-latest

    steps:
      - name: SSH dan jalankan deploy.sh di VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          # Aktifkan jika SSH bukan port 22
          # port: ${{ secrets.VPS_PORT }}

          envs: GHCR_USER,GHCR_PAT,IMAGE_TAG

          script: |
            bash /opt/lydera/deploy.sh "$IMAGE_TAG"

        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}


  # ============================================================
  # JOB 3: ROLLBACK — TIDAK build sama sekali, langsung pull
  # image versi lama yang SUDAH ADA di GHCR
  # ============================================================
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_tag != ''
    runs-on: ubuntu-latest
 
    steps:
      - name: SSH dan jalankan deploy.sh dengan tag LAMA
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_PAT,IMAGE_TAG
          script: |
            echo "==> ROLLBACK ke versi ${IMAGE_TAG}, TIDAK ada build baru"
            bash /opt/lydera/deploy.sh "$IMAGE_TAG"
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{ inputs.rollback_tag }}
 